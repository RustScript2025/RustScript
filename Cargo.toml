[package]
name = "rustscript"
version = "0.4.0"
edition = "2024"
rust-version = "1.91.1"
authors = ["Michael Lauzon"]
license = "GPL-2.0"
description = "A Rust/ECMAScript mashup language compiler"
repository = "https://github.com/paigeadelethompson/RustScript"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rsxe"
path = "src/main.rs"

[dependencies]
logos = "0.15.1"
logos-derive = "0.15.1"
pest = "2.8.4"
pest_derive = "2.8.4"
lazy_static = "1.5.0"
codespan = "0.13.1"
codespan-reporting = "0.13.1"
ariadne = "0.6.0"
indexmap = "2.12.0"
fxhash = "0.2.1"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5.52", features = ["derive"] }
anyhow = "1.0.100"
pathdiff = "0.2.3"
glob = "0.3.3"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
console_error_panic_hook = "0.1.7"
wasm-encoder = "0.242.0"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = ["console"] }
