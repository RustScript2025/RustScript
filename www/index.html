<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>RustScript Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #e94560;
        }
        #output {
            background: #16213e;
            border: 1px solid #e94560;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            min-width: 400px;
            min-height: 100px;
            text-align: left;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            white-space: pre-wrap;
        }
        #output .log {
            color: #0f0;
        }
        #output .error {
            color: #f44;
        }
        .game-links {
            margin-top: 40px;
            text-align: left;
        }
        .game-links h2 {
            color: #e94560;
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        .game-links a {
            display: block;
            color: #4ecca3;
            text-decoration: none;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #4ecca3;
            transition: all 0.2s;
        }
        .game-links a:hover {
            background: #16213e;
            padding-left: 20px;
            border-left-color: #e94560;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RustScript Output</h1>
        <div id="output"></div>
        
        <div class="game-links">
            <h2>Games</h2>
            <a href="hideseek.html">🔍 Hide and Seek</a>
            <a href="hideseek_v2.html">🔍 Hide and Seek v2</a>
            <a href="hideseek_v3.html">🔍 Hide and Seek v3</a>
        </div>
    </div>

    <script type="text/rustscript">
fn main() {
    console.log("Hello from RustScript!");
}
    </script>

    <script type="module">
        // ====================================================================
        // RustScript Runtime Loader
        // ====================================================================
        // This script initialises the RustScript WebAssembly runtime and
        // executes any embedded RustScript code on the page.
        // ====================================================================

        import init, { run_script } from './pkg/RustScript.js';
        
        // Reference to the output element for displaying results.
        const outputEl = document.getElementById('output');
        
        // Writes output to the display element with optional styling.
        function writeOutput(text, type = 'log') {
            if (outputEl) {
                const line = document.createElement('div');
                line.className = type;
                line.textContent = text;
                outputEl.appendChild(line);
            }
        }
        
        // Store reference to globalThis for RustScript memory access.
        globalThis.__rustscript_writeOutput = writeOutput;
        
        // Main initialisation function - loads the WASM module and runs scripts.
        async function main() {
            await init();
            console.log('🦀 RustScript Runtime Initialised 🦀');
            
            const scripts = document.querySelectorAll('script[type="text/rustscript"]');
            
            for (const script of scripts) {
                const source = script.textContent.trim();
                if (source) {
                    try {
                        await run_script(source);
                    } catch (e) {
                        writeOutput('Error: ' + e, 'error');
                    }
                }
            }
        }
        
        main();
    </script>
</body>
</html>
