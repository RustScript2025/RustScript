<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer ring - brighter red -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ff3355" stroke-width="4"/>
  
  <!-- 4 cardinal gear teeth -->
  <rect x="28" y="2" width="8" height="8" fill="#ff3355"/>
  <rect x="28" y="54" width="8" height="8" fill="#ff3355"/>
  <rect x="2" y="28" width="8" height="8" fill="#ff3355"/>
  <rect x="54" y="28" width="8" height="8" fill="#ff3355"/>
  
  <!-- 4 diagonal gear teeth -->
  <rect x="10" y="10" width="7" height="7" fill="#ff3355" transform="rotate(45, 13.5, 13.5)"/>
  <rect x="47" y="10" width="7" height="7" fill="#ff3355" transform="rotate(45, 50.5, 13.5)"/>
  <rect x="10" y="47" width="7" height="7" fill="#ff3355" transform="rotate(45, 13.5, 50.5)"/>
  <rect x="47" y="47" width="7" height="7" fill="#ff3355" transform="rotate(45, 50.5, 50.5)"/>
  
  <!-- R green, S blue, thicker, touching -->
  <text x="26" y="40" text-anchor="middle" fill="#22cc66" font-family="Arial, sans-serif" font-size="20" font-weight="700">R</text>
  <text x="38" y="40" text-anchor="middle" fill="#3399ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">S</text>
</svg>